services:
  - type: web
    name: holoscopic-socket-server
    env: node
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: node websocket-server.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Concurrent Socket.IO cap (websocket-server.js falls back to 25).
      # Each phone in a live Spectrum room + each interView player = 1 socket.
      - key: MAX_CONNECTIONS
        value: 200
