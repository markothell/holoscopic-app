services:
  - type: web
    # The deployed service is holoscopic-websocket-server. This file said
    # holoscopic-socket-server, which matched nothing on the account.
    name: holoscopic-websocket-server
    env: node
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: node websocket-server.js
    # /health returns 503 unless Mongo is connected, routes are loaded, AND a
    # token secret is present — so a write-dead deploy never takes traffic.
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Shared HS256 secret with the Next.js frontends, which sign short-lived
      # identity tokens (each app's /api/auth/game-token). MUST match the value
      # in Vercel. Without it middleware/verifyUser.js 503s every
      # identity-bearing write while reads keep working — the failure looks
      # like "the site is up but nothing saves".
      - key: GAME_TOKEN_SECRET
        sync: false
      # Concurrent Socket.IO cap. websocket-server.js:28 falls back to 25,
      # which is a development number — each phone in a live Spectrum room and
      # each interView player holds one socket, so 25 is a few rooms. Declared
      # here as a literal because it is configuration, not a secret, and its
      # value is the kind of thing that must be reviewable in a diff.
      - key: MAX_CONNECTIONS
        value: 200
      # ── Synthesis LLM (apps/synthesis) ──────────────────────────────────
      # Two independent vendors: chat generation and embeddings. Either can be
      # absent — the adapters report `configured: false` and the feature that
      # needs them is skipped rather than erroring.
      #
      # These are the PRIMARY names the adapters read. ANTHROPIC_API_KEY and
      # VOYAGE_API_KEY also work but are the fallback branch
      # (llm/adapters/chat.js:48, embed.js:40); setting the SYN_ names keeps
      # "which key does this deployment use" answerable from this file.
      - key: SYN_MODEL_API_KEY
        sync: false
      - key: SYN_EMBED_API_KEY
        sync: false
      # Chorus (apps/chorus) — memorial transcription. Deepgram fetches a
      # memory's audio from Vercel Blob and POSTs the transcript back here, so
      # it needs this service's own public URL.
      #
      # PUBLIC_API_URL is intentionally absent: utils/memorialTranscribe.js
      # derives the callback base from RENDER_EXTERNAL_URL, which Render
      # injects — so this service carries no hand-set copy of its own address,
      # and a rename cannot strand it. Set PUBLIC_API_URL only to override
      # (a dev tunnel, or a non-Render host).
      #
      # VERIFIED in production: with PUBLIC_API_URL set nowhere on this
      # service, /health reports "transcription": "ready" and a recorded memory
      # came back transcribed. RENDER_EXTERNAL_URL is populated here, so this
      # service needs no PUBLIC_API_URL at all — do not "helpfully" add one.
      #
      # If a future deploy ever reports "no-callback-url", the derive found
      # nothing: uncomment the two lines below and set the value to this
      # service's own public URL INCLUDING the /api mount point, e.g.
      # https://whorl-websocket-server.onrender.com/api
      # - key: PUBLIC_API_URL
      #   sync: false
      #
      # Optional. Without it transcripts stay 'skipped' and everything else in
      # Chorus works unchanged. Whether it is actually working is reported by
      # /health as `transcription` — check that rather than making a test
      # recording and waiting to see if text appears.
      - key: DEEPGRAM_API_KEY
        sync: false
      # ── Off-site media copy (utils/blobMirror.js) ───────────────────────
      # The SAME bucket the nightly cron writes to. Set here as well so a
      # recording is copied the moment it is made rather than waiting until
      # 07:00 — for a contributor who records once and never returns, that
      # window is the entire risk.
      #
      # Unset = no mirroring, reported by /health as `mediaBackup`. Recording
      # still works; the voice just lives in one place.
      #
      # All five are required, REGION included — it is the SigV4 signing region,
      # so a missing or wrong value means every upload is rejected while the
      # config still reads as complete. `mediaBackup: no-region` names that case.
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      # Optional. Error reporting (observability.js). Unset = disabled, no
      # behaviour change. Request bodies, headers and cookies are never sent,
      # and /api/memorial context is withheld entirely — Chorus stores stories
      # and recorded voices belonging to people who never agreed to a vendor.
      - key: SENTRY_DSN
        sync: false

  # Off-site backup, daily at 07:00 UTC. TWO jobs in one image:
  #   scripts/backup-mongo.js  → mongodump of the database
  #   scripts/backup-blobs.js  → every recording and subject photo the database
  #                              references, copied to the same bucket
  #
  # Atlas M10 continuous backup + PITR is the primary recovery path for the
  # DATABASE. This is the independent second copy: Atlas snapshots live in the
  # same Atlas account, so they do not survive account compromise, an
  # accidentally deleted cluster, or somebody running reset-db-for-launch.js
  # against prod.
  #
  # Vercel Blob has NO equivalent — no snapshots, no versioning, no undelete.
  # Until backup-blobs.js ran, every recorded voice in Chorus existed in exactly
  # one place, and a deleted store took it with the Memory documents left
  # behind pointing at nothing. utils/blobMirror.js also copies each recording
  # on write; this sweep is the backstop that catches what that missed.
  #
  # A separate service, not a job inside the web process — mongodump competes
  # for the same memory and would die on deploy.
  #
  # runtime: docker because Render's Node image has no mongodb-database-tools;
  # scripts/backup-mongo.js exits non-zero if mongodump is missing rather than
  # recording a backup that never happened.
  #
  # THE BUCKET (provisioned 2026-07-31, AWS account 736414043461):
  #   s3://chorus-app-backup, us-east-2, versioning ON, SSE-S3, all four public
  #   access blocks ON. Endpoint https://s3.us-east-2.amazonaws.com.
  #
  #   IAM user `holoscopic-backup` holds PutObject + GetObject and an explicit
  #   Deny on every delete, so a compromised backend cannot erase its own
  #   backups. GetObject is NOT optional — the scripts HEAD to dedupe, read
  #   back to verify an upload, and GET to restore. Verified by round trip:
  #   put/head/get succeed, DeleteObject returns AccessDenied.
  #
  # RETENTION is lifecycle rules on the bucket, never this service's job —
  # that is what lets the credential above have no delete permission at all.
  # S3 lifecycle expires by age only; it cannot express grandfather-father-son,
  # so the earlier "7 daily / 4 weekly / 3 monthly" plan became:
  #   mongo/  expire at 90 days, noncurrent versions at 30  (~90 dailies)
  #   blob/   NEVER expires — transitions to STANDARD_IA at 90 days
  # The split is the point. Dumps regenerate nightly and are disposable; the
  # objects under blob/ are recorded voices with no second take, and an
  # age-based expiry applied bucket-wide would delete them on a timer.
  #
  # STILL REQUIRED:
  #   1. Create a read-only Atlas user (readAnyDatabase) → MONGODB_URI_BACKUP.
  #      A leaked backup credential must not be able to write.
  #   2. Set BACKUP_HEARTBEAT_URL to a dead-man's-switch (healthchecks.io) so
  #      a MISSING backup pages you. A backup nobody is alerted about is not a
  #      backup.
  #
  # The SAME BACKUP_S3_* values belong on the web service too — that is what
  # lets utils/blobMirror.js copy a recording the moment it is made, instead of
  # leaving it unprotected until the next 07:00. GET /health reports
  # `mediaBackup` so you can tell from outside whether it is actually on.
  #
  # Restore is scripts/restore-blobs.js. Do a --dry-run once now; a copy nobody
  # has ever restored from is a guess, not a backup.
  - type: cron
    name: holoscopic-mongo-backup
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile.backup
    dockerContext: .
    schedule: "0 7 * * *"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI_BACKUP
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_HEARTBEAT_URL
        sync: false
