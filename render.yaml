services:
  - type: web
    name: holoscopic-socket-server
    env: node
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: node websocket-server.js
    # /health returns 503 unless Mongo is connected, routes are loaded, AND a
    # token secret is present — so a write-dead deploy never takes traffic.
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Shared HS256 secret with the Next.js frontends, which sign short-lived
      # identity tokens (each app's /api/auth/game-token). MUST match the value
      # in Vercel. Without it middleware/verifyUser.js 503s every
      # identity-bearing write while reads keep working — the failure looks
      # like "the site is up but nothing saves".
      - key: GAME_TOKEN_SECRET
        sync: false
      # Concurrent Socket.IO cap. websocket-server.js:28 falls back to 25,
      # which is a development number — each phone in a live Spectrum room and
      # each interView player holds one socket, so 25 is a few rooms. Declared
      # here as a literal because it is configuration, not a secret, and its
      # value is the kind of thing that must be reviewable in a diff.
      - key: MAX_CONNECTIONS
        value: 200
      # ── Synthesis LLM (apps/synthesis) ──────────────────────────────────
      # Two independent vendors: chat generation and embeddings. Either can be
      # absent — the adapters report `configured: false` and the feature that
      # needs them is skipped rather than erroring.
      #
      # These are the PRIMARY names the adapters read. ANTHROPIC_API_KEY and
      # VOYAGE_API_KEY also work but are the fallback branch
      # (llm/adapters/chat.js:48, embed.js:40); setting the SYN_ names keeps
      # "which key does this deployment use" answerable from this file.
      - key: SYN_MODEL_API_KEY
        sync: false
      - key: SYN_EMBED_API_KEY
        sync: false
      # Chorus (apps/chorus) — memorial transcription. Deepgram fetches a
      # memory's audio from Vercel Blob and POSTs the transcript back here, so
      # it needs this service's own public URL.
      #
      # PUBLIC_API_URL is intentionally absent: utils/memorialTranscribe.js
      # derives the callback base from RENDER_EXTERNAL_URL, which Render
      # injects — so this service carries no hand-set copy of its own address,
      # and a rename cannot strand it. Set PUBLIC_API_URL only to override
      # (a dev tunnel, or a non-Render host).
      #
      # UNVERIFIED as of this commit: that RENDER_EXTERNAL_URL is actually
      # populated here. Confirm on the first deploy with
      #   curl $SERVICE/health   → "transcription": "ready"
      # If it reports "no-callback-url" instead, the derive found nothing —
      # uncomment the two lines below and set the value to this service's own
      # public URL INCLUDING the /api mount point, e.g.
      # https://whorl-websocket-server.onrender.com/api
      # - key: PUBLIC_API_URL
      #   sync: false
      #
      # Optional. Without it transcripts stay 'skipped' and everything else in
      # Chorus works unchanged. Whether it is actually working is reported by
      # /health as `transcription` — check that rather than making a test
      # recording and waiting to see if text appears.
      - key: DEEPGRAM_API_KEY
        sync: false
      # Optional. Error reporting (observability.js). Unset = disabled, no
      # behaviour change. Request bodies, headers and cookies are never sent,
      # and /api/memorial context is withheld entirely — Chorus stores stories
      # and recorded voices belonging to people who never agreed to a vendor.
      - key: SENTRY_DSN
        sync: false

  # Off-site logical backup, daily at 07:00 UTC.
  #
  # Atlas M10 continuous backup + PITR is the primary recovery path. This is
  # the independent second copy: Atlas snapshots live in the same Atlas
  # account, so they do not survive account compromise, an accidentally
  # deleted cluster, or somebody running reset-db-for-launch.js against prod.
  #
  # A separate service, not a job inside the web process — mongodump competes
  # for the same memory and would die on deploy.
  #
  # runtime: docker because Render's Node image has no mongodb-database-tools;
  # scripts/backup-mongo.js exits non-zero if mongodump is missing rather than
  # recording a backup that never happened.
  #
  # SETUP REQUIRED before this does anything (see scripts/backup-mongo.js):
  #   1. Create a read-only Atlas user (readAnyDatabase) → MONGODB_URI_BACKUP.
  #      A leaked backup credential must not be able to write.
  #   2. Create an S3-compatible bucket (Cloudflare R2 or S3) with versioning
  #      and lifecycle rules for retention: 7 daily / 4 weekly / 3 monthly.
  #      Grant this service PutObject only — never DeleteObject, so a
  #      compromised backend cannot erase its own backups.
  #   3. Set BACKUP_HEARTBEAT_URL to a dead-man's-switch (healthchecks.io) so
  #      a MISSING backup pages you. A backup nobody is alerted about is not a
  #      backup.
  - type: cron
    name: holoscopic-mongo-backup
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile.backup
    dockerContext: .
    schedule: "0 7 * * *"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI_BACKUP
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_HEARTBEAT_URL
        sync: false
