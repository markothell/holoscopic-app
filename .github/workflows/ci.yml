name: CI

# Nothing ran between a local commit and production before this: no workflow,
# no git hooks, no lint script in any workspace, and turbo.json declared a
# `lint` task no workspace implemented. A broken import, a type error, or a
# failing test reached the deployed site unchallenged.
on:
  push:
    branches: ['**']
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The fast suite: no database, ~1s. Covers the auth boundary
      # (middleware/auth.test.js), the public-read allow-list
      # (models/Instance.test.js), the vendor-call guardrails
      # (llm/resilience.test.js) and the Chorus/Synthesis funnels.
      - name: Unit tests
        run: npm test --workspace=apps/backend

  db-tests:
    name: Money-path tests (database)
    runs-on: ubuntu-latest
    # These are the ONLY coverage utils/holons.js and utils/sweeps.js have, and
    # what they assert cannot be faked: transactional rollback, and
    # exactly-once settlement under concurrency. They need a real replica set,
    # so they are opt-in locally (RUN_DB_TESTS=1) and always run here.
    #
    # No `services:` block: mongod only accepts --replSet as a command-line
    # argument, and GitHub Actions' `options:` maps to `docker create` flags,
    # with no way to append arguments after the image name. A service
    # container therefore always starts as a standalone, and rs.initiate()
    # against one throws "This node was not started with replication enabled"
    # -- uncaught, since the catch above only expects rs.status() to fail.
    # Confirmed against a real `docker run mongo:7` (no --replSet) before
    # writing this fix. Started by hand below instead, where the replSet flag
    # can actually be passed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand("ping").ok' 2>/dev/null | grep -q '^1$'; then
              echo "mongod ready"; break
            fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null | grep -q '^1$'; then
              echo "replica set primary ready"; break
            fi
            sleep 2
          done

      # The test files read MONGODB_URI from apps/backend/.env.local, which is
      # not committed. Written here so CI points at the service container and
      # can never reach a real cluster.
      - name: Point tests at the ephemeral database
        run: |
          cat > apps/backend/.env.local <<'EOF'
          MONGODB_URI=mongodb://localhost:27017/holoscopic-ci?directConnection=true
          GAME_TOKEN_SECRET=ci-only-not-a-real-secret
          EOF

      - name: Money-path and sweep tests
        run: npm test --workspace=apps/backend
        env:
          RUN_DB_TESTS: '1'

  typecheck:
    name: Typecheck ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [holoscopic-game, platform, spectrum, synthesis, chorus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Chorus's /c/[slug] routes type their params off Next's generated
      # LayoutProps/PageProps rather than hand-written shapes (so a moved or
      # renamed route folder is a type error here, not a silently-undefined
      # param at runtime) — those ambient types live in .next/types and only
      # `next build`/`next dev`/`next typegen` produce them. Without this, tsc
      # sees a bare checkout and fails with "Cannot find name 'PageProps'" on
      # every app that uses the pattern, even though `next build` on Vercel
      # would have generated them and passed.
      - run: npx next typegen apps/${{ matrix.app }}
      # Types were only ever checked as a side effect of `next build` on Vercel,
      # i.e. after merge. tsc --noEmit is the same check, minutes earlier.
      - run: npx tsc --noEmit -p apps/${{ matrix.app }}/tsconfig.json

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env files are gitignored, but "gitignored" and "never committed" are
      # different claims and only one of them is enforceable.
      - name: Reject tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)'; then
            echo "::error::A .env file is tracked in git."
            exit 1
          fi
          echo "no tracked .env files"
